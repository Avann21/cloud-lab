services:

  - type: web
    name: mern-app
    runtime: node
    buildCommand: npm --prefix nern-demo ci --omit=dev && npm --prefix client ci && npm --prefix client run build
    startCommand: node nern-demo/server/server.js
    healthCheckPath: /health
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false
