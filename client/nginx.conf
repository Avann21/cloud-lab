server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing - redirect all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    # Dùng biến + resolver để nginx không crash lúc старт khi DNS chưa có (lỗi "host not found in upstream" trên Render)
    location /api/ {
        resolver 127.0.0.11 1.1.1.1 valid=30s;
        set $backend_host mern-backend;
        proxy_pass http://$backend_host:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
